name: Publish v1.10.4

on:
  push:
    branches: [main]
    paths:
      - ".release/v1.10.4/**"
      - ".github/workflows/publish-v1.10.4.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and verify v1.10.4 toolkit
        shell: bash
        run: |
          set -euo pipefail
          ZIP="/tmp/OpenClaw_Backup_Migration_Toolkit_v1.10.4.zip"
          EXPECTED="ee0d114ad9417dadcf248e89a4d8b677c00304b2638edf4bd47a02f40af5116a"

          cat .release/v1.10.4/tool.zip.b64.* | tr -d '\r\n' | base64 --decode > "$ZIP"
          echo "$EXPECTED  $ZIP" | sha256sum -c -
          test "$(stat -c%s "$ZIP")" -eq 48338
          unzip -t "$ZIP"

          rm -rf /tmp/openclaw-toolkit
          mkdir -p /tmp/openclaw-toolkit
          unzip -q "$ZIP" -d /tmp/openclaw-toolkit

          SRC="/tmp/openclaw-toolkit/OpenClaw_Backup_Migration_Toolkit"
          test -f "$SRC/OpenClaw-Backup-Migrate.ps1"
          test -f "$SRC/OpenClaw-Backup-Migrate.cmd"
          grep -F '$Script:ToolVersion = "1.10.4"' "$SRC/OpenClaw-Backup-Migrate.ps1"

          mkdir -p dist
          cp "$ZIP" dist/OpenClaw_Backup_Migration_Toolkit_v1.10.4.zip
          cp "$SRC/OpenClaw-Backup-Migrate.ps1" ./OpenClaw-Backup-Migrate.ps1
          cp "$SRC/OpenClaw-Backup-Migrate.cmd" ./OpenClaw-Backup-Migrate.cmd
          cp "$SRC/README.txt" ./TOOLKIT-README.txt

          sha256sum dist/OpenClaw_Backup_Migration_Toolkit_v1.10.4.zip

      - name: Commit verified release files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add OpenClaw-Backup-Migrate.ps1 OpenClaw-Backup-Migrate.cmd TOOLKIT-README.txt dist/OpenClaw_Backup_Migration_Toolkit_v1.10.4.zip
          if ! git diff --cached --quiet; then
            git commit -m "Materialize verified Hatch IQ OpenClaw Toolkit v1.10.4"
            git push origin HEAD:main
          fi

      - name: Create or refresh GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ZIP="dist/OpenClaw_Backup_Migration_Toolkit_v1.10.4.zip"
          if gh release view v1.10.4 >/dev/null 2>&1; then
            gh release upload v1.10.4 "$ZIP" --clobber
          else
            gh release create v1.10.4 "$ZIP" \
              --title "Hatch IQ OpenClaw Toolkit v1.10.4" \
              --notes-file RELEASE_NOTES_v1.10.4.md \
              --target main
          fi

      - name: Verify release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view v1.10.4 --json tagName,name,url,assets
